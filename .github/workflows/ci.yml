name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: wolt-reg-bot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests
        env:
          PYTHONPATH: .
          BOT_TOKEN: test-bot-token
          HERO_KEY: test-hero-key-xxxxxxxxxxxxxxxx
          ADMIN_ID: "1"
        run: python -m unittest discover -s tests -v
      - name: Syntax
        run: python -m compileall -q bot.py tests
